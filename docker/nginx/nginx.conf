# Reverse proxy for FramePack Studio.
#
# Mounted read-only at /etc/nginx/conf.d/default.conf, so edits take effect with
#   docker compose -f docker-compose.https.yml restart nginx
# and never need an image rebuild.
#
# Point NGINX_CONF at a copy of this file to override it without editing it.

# Gradio upgrades some connections to websockets; nginx only forwards the
# upgrade when Connection is set to match, and "close" for everything else.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    # No IPv6 listener: the default compose bridge network often has no IPv6,
    # and nginx refuses to start if it can't bind the socket.
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Input images, videos and LoRA files can be large; 0 removes the cap entirely.
    client_max_body_size 0;

    location / {
        # <- the only line to change when reusing this for another service.
        #    "studio" is the compose service name, 7860 the in-container port.
        proxy_pass http://studio:7860;

        # 1.1 is required for keepalive to the upstream, and for the websocket
        # upgrade Gradio's event stream relies on.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # $http_host, not $host: nginx strips the port from $host, and Gradio
        # builds every asset and event-stream URL from X-Forwarded-Host. With the
        # port missing the browser is sent to https://<host>/ - port 443, where
        # nothing is listening - so the page loads unstyled and every request
        # fails with "Connection errored out". $http_host keeps the :8443.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;

        # A generation can run for many minutes without sending a byte. The 60s
        # default would drop the connection mid-job.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Gradio streams progress over SSE; buffering would hold those events
        # back until the job finished.
        proxy_buffering off;
        proxy_request_buffering off;
    }
}

# Optional HTTP -> HTTPS redirect.
#
# Only correct when HTTPS is published on 443: nginx cannot know which host port
# maps to this container, so it can't build a redirect to a non-standard port.
# If you set HTTPS_PORT=443, uncomment this and add "- 80:80" to the nginx ports.
