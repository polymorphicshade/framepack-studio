services:
  studio:
    build:
      # modify this if you are building the image locally and need a different CUDA version
      args:
        - CUDA_VERSION=12.4.1
        # Installs SageAttention into the image for faster generation.
        # Only applies when the image is built locally:
        #   docker compose -f <this file> up -d --build
        # A plain 'up' pulls the published image, which has no attention library.
        - INSTALL_SAGEATTENTION=true
    # modify the tag here if you need a different CUDA version or branch
    image: colinurbs/fp-studio:cuda12.4-latest-develop
    restart: unless-stopped
    ports:
      - "${PORT:-8005}:7860"
    volumes:
      - "./loras:/app/loras"
      - "./outputs:/app/outputs"
      - "./.framepack:/app/.framepack"
      - "./modules/toolbox/model_esrgan:/app/modules/toolbox/model_esrgan"
      - "./modules/toolbox/model_rife:/app/modules/toolbox/model_rife"
      - "$HOME/.cache/huggingface:/app/hf_download"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
